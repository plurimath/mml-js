name: release

# npm Trusted Publishing — passwordless via GitHub OIDC.
#
# Prerequisites (one-time, on npmjs.com):
#   Package → Settings → Publishing access → Add Trusted Publisher
#   Repository: <org>/<repo>
#   Workflow filename: release.yml
#   Environment: (leave blank unless you set one in the workflow below)
#
# No NPM_TOKEN secret needed. npm CLI 10.9.1+ handles OIDC automatically.

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: "Version to publish (x.y.z, major, minor, patch, skip)"
        required: true
        default: 'skip'
      ruby_ref:
        description: "plurimath/mml ref to build (empty: the pinned MML_REF)"
        required: false
        default: ''
  repository_dispatch:
    types: [ do-release ]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: ver
        # The dispatch payload and input reach the script only through
        # env, and the version is validated before it is used.
        env:
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          INPUT_VERSION: ${{ github.event.inputs.next_version }}
          PAYLOAD_RUBY_REF: ${{ github.event.client_payload.ruby_ref }}
          INPUT_RUBY_REF: ${{ github.event.inputs.ruby_ref }}
        run: |
          VERSION="${PAYLOAD_VERSION:-$INPUT_VERSION}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "skip" ]; then
            VERSION=$(node -p "require('./package.json').version")
          fi
          if ! [[ "$VERSION" =~ ^((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?|major|minor|patch)$ ]]; then
            echo "::error::invalid version: $VERSION"
            exit 1
          fi
          # Empty unless the dispatch or input names an mml ref; build.js
          # then uses its pinned MML_REF.
          RUBY_REF="${PAYLOAD_RUBY_REF:-$INPUT_RUBY_REF}"
          if [ -n "$RUBY_REF" ] && { ! [[ "$RUBY_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]] || [[ "$RUBY_REF" == *..* ]]; }; then
            echo "::error::invalid ruby_ref: $RUBY_REF"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "ruby_ref=$RUBY_REF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # NO registry-url — prevents setup-node from writing

      - name: Upgrade npm CLI (Trusted Publishers needs 10.9.1+)
        run: |
          npm install -g npm@latest
          npm --version          # _authToken to .npmrc, which would shadow OIDC auth.

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install Opal
        run: gem install opal --no-document

      - name: Install JS deps
        run: npm install

      - name: Build
        run: node scripts/build.js
        env:
          RUBY_REF: ${{ steps.ver.outputs.ruby_ref }}
          OPAL_PREFORK_DISABLE: "1"

      - name: Smoke test
        run: |
          node scripts/test.js
          VARIANT=external node scripts/test.js

      - name: Set package version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if [ "$VERSION" != "$(node -p "require('./package.json').version")" ]; then
            npm version "$VERSION" --no-git-tag-version
          fi

      # A dispatch can name a version already on npm (for example after an
      # mml release with next_version=skip); npm refuses to republish one,
      # so that case ends here as a success instead of a failed publish.
      - name: Skip a version already on npm
        id: published
        run: |
          set -eu
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@plurimath/mml@$VERSION" version 2>/dev/null | grep -qxF "$VERSION"; then
            echo "@plurimath/mml@$VERSION is already on npm; skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "@plurimath/mml@$VERSION is not on npm; publishing"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm (Trusted Publisher — passwordless OIDC)
        if: steps.published.outputs.skip != 'true'
        run: npm publish --provenance --access public
